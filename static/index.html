<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CustomerBot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5; display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .chat-container {
    width: 100%; max-width: 480px; height: 100vh; max-height: 600px;
    background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; margin: 20px; overflow: hidden;
  }
  .chat-header {
    background: #1a73e8; color: white; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h1 { font-size: 20px; font-weight: 600; }
  .chat-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .chat-header a { color: white; font-size: 13px; opacity: 0.8; text-decoration: none; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .message.user { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .message.bot { background: #fce4ec; color: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
  .message.bot.streaming { border-left: 3px solid #e91e63; }
  .message-footer { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; }
  .message.bot .message-footer { justify-content: flex-start; }
  .feedback-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 12px; color: #666; }
  .feedback-btn:hover { border-color: #1a73e8; color: #1a73e8; }
  .feedback-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; }
  .input-area { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid #e0e0e0; background: white; }
  .input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: #1a73e8; }
  .input-area button {
    background: #1a73e8; color: white; border: none; border-radius: 50%;
    width: 44px; height: 44px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  .input-area button:hover { background: #1557b0; }
  .input-area button:disabled { background: #a0c4ff; cursor: not-allowed; }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); } 40% { transform: scale(1); } }
  .error { color: #d32f2f; font-size: 13px; padding: 8px 24px; text-align: center; display: none; }
  .footer { text-align: center; font-size: 12px; color: #999; padding: 12px 24px; border-top: 1px solid #f0f0f0; }
  .footer a { color: #e91e63; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .navbar .brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; font-weight: 700; font-size: 18px;
    color: #e91e63;
  }
  .navbar .brand svg { width: 28px; height: 28px; }
  .navbar .links { display: flex; gap: 6px; }
  .navbar .links a {
    padding: 6px 14px; border-radius: 8px; font-size: 14px;
    text-decoration: none; color: #555; transition: all 0.2s;
  }
  .navbar .links a:hover { background: #fce4ec; color: #e91e63; }
  .navbar .links a.active { background: #e91e63; color: white; }
</style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 18 C50 18 38 34 30 44 C22 54 22 64 30 70 C38 76 50 68 50 68 C50 68 62 76 70 70 C78 64 78 54 70 44 C62 34 50 18 50 18Z" fill="#e91e63"/>
        <circle cx="50" cy="50" r="8" fill="white"/>
        <path d="M48 46 L50 42 L52 46 L56 48 L52 50 L50 54 L48 50 L44 48Z" fill="#e91e63"/>
      </svg>
      Melz Care
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/products">Shop</a>
      <a href="/payment">Pay</a>
      <a href="/about">About</a>
      <a href="/analytics">Analytics</a>
      <a href="/chat" class="active">Support</a>
      <a href="/returns">Returns</a>
      <a href="/products" style="font-size:20px;padding:6px 10px">&#x1F6D2;</a>
    </div>
  </nav>
<div class="chat-container" style="margin-top:56px">
  <div class="chat-header">
    <div>
      <h1>CustomerBot</h1>
      <p>Support Agent — AcmeShop</p>
    </div>
    <a href="/analytics" target="_blank">Analytics</a>
  </div>
  <div class="messages" id="messages">
    <div class="message bot">Hi! I'm the AcmeShop support assistant. How can I help you today?</div>
  </div>
  <div class="error" id="error"></div>
  <div class="footer">
    <a href="/">Home</a> &middot; <a href="/products">Shop</a> &middot; <a href="/returns">Returns</a> &middot; <a href="/payment">Pay</a> &middot; <a href="/about">About</a> &middot; <a href="/analytics">Analytics</a> &middot; &copy; 2026 Melz Care
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Type your message..." autofocus>
    <button id="sendBtn" onclick="sendMessage()">&#10148;</button>
  </div>
</div>

<script>
const SESSION_ID = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const errorEl = document.getElementById('error');
let conversationHistory = [];

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addBotMessageWithFeedback(text, logId) {
  const div = document.createElement('div');
  div.className = 'message bot';
  div.textContent = text;
  const footer = document.createElement('div');
  footer.className = 'message-footer';
  const up = document.createElement('button');
  up.className = 'feedback-btn';
  up.textContent = '\u{1F44D}';
  up.onclick = () => sendFeedback(logId, 1, up, down);
  const down = document.createElement('button');
  down.className = 'feedback-btn';
  down.textContent = '\u{1F44E}';
  down.onclick = () => sendFeedback(logId, -1, up, down);
  footer.appendChild(up);
  footer.appendChild(down);
  div.appendChild(footer);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendFeedback(logId, value, upBtn, downBtn) {
  await fetch('/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ log_id: logId, value }),
  });
  upBtn.classList.toggle('active', value === 1);
  downBtn.classList.toggle('active', value === -1);
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  inputEl.value = '';
  errorEl.style.display = 'none';
  sendBtn.disabled = true;

  addMessage(text, 'user');
  conversationHistory.push('Customer: ' + text);
  const typingEl = showTyping();

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory, session_id: SESSION_ID }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let botText = '';

    typingEl.remove();
    const botMsgEl = addMessage('', 'bot');
    botMsgEl.classList.add('streaming');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') continue;
          try {
            const data = JSON.parse(payload);
            if (data.token) {
              botText += data.token;
              botMsgEl.textContent = botText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch {}
        }
      }
    }
    botMsgEl.classList.remove('streaming');
    botMsgEl.textContent = botText;
    conversationHistory.push('Agent: ' + botText);
  } catch (err) {
    typingEl.remove();
    errorEl.textContent = 'Connection error. Make sure Ollama is running.';
    errorEl.style.display = 'block';
  }
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
